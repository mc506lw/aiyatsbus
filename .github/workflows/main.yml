name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build project
      run: ./gradlew build --no-daemon

    # 🔍 关键步骤：精确查找所有 JAR 产物并显示详细信息
    - name: Locate and display all JAR files
      run: |
        echo "=== 所有生成的 JAR 文件 ==="
        find . -type d -name "libs" -exec sh -c '
          for dir in "$1"/*; do
            [ -f "$dir" ] && echo "✓ $(basename $dir) ($(du -h $dir | cut -f1))"
          done
        ' sh {} \;
        echo ""
        echo "=== 完整路径列表 ==="
        find . -path "./.gradle" -prune -o -path "./.git" -prune -o -name "*.jar" -type f -print

    # ✅ 上传 plugin 模块产物（TabooLib 项目主插件）
    - name: Upload plugin artifact
      uses: actions/upload-artifact@v4
      with:
        name: aiyatsbus-plugin
        path: plugin/build/libs/*.jar
        retention-days: 7
        if-no-files-found: error  # 必须找到文件，否则失败

    # ✅ 上传根项目产物（如有）
    - name: Upload root project artifact (optional)
      uses: actions/upload-artifact@v4
      with:
        name: aiyatsbus-root
        path: build/libs/*.jar
        retention-days: 7
        if-no-files-found: ignore

    # ✅ 上传 project 模块产物（如有）
    - name: Upload project core artifact (optional)
      uses: actions/upload-artifact@v4
      with:
        name: aiyatsbus-core
        path: project/build/libs/*.jar
        retention-days: 7
        if-no-files-found: ignore
