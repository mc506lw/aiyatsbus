name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build project
      run: ./gradlew build --no-daemon

    # 调试：确认产物位置
    - name: Debug - List all JAR files
      run: |
        echo "=== 所有生成的 JAR 文件 ==="
        find . -path ./build -prune -o -name "*.jar" -type f -print | grep -E "(plugin|project)/build/libs"

    # 上传主插件产物（TabooLib 项目通常只需要 plugin 模块的 JAR）
    - name: Upload plugin artifact
      uses: actions/upload-artifact@v4
      with:
        name: aiyatsbus-plugin
        path: plugin/build/libs/plugin-*.jar
        retention-days: 7
        if-no-files-found: error  # 确保必须找到文件

    # 可选：上传核心模块（如需分发依赖）
    - name: Upload project core artifact (optional)
      uses: actions/upload-artifact@v4
      with:
        name: aiyatsbus-core
        path: project/build/libs/project-*.jar
        retention-days: 7
        if-no-files-found: ignore
